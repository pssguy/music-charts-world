# .github/workflows/render-deploy.yml
# Renders the Quarto site weekly (Friday) and deploys to GitHub Pages.
# Also runs on push to main so you can trigger manually.

name: Render & Deploy

on:
  schedule:
    - cron: '0 6 * * 5'   # Every Friday at 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            dplyr
            tidyr
            purrr
            stringr
            plotly
            htmltools
            htmlwidgets
            lubridate
            rvest
            tibble

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render world-music-watch.qmd

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site     # Quarto's default output directory

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
