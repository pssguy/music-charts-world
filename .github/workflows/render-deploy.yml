name: Validate, Render & Deploy

"on":
  schedule:
    - cron: "0 22 * * 5"
    - cron: "0 18 * * 6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify release configuration
        run: python3 scripts/check_release_config.py

  fetch_validate:
    name: Fetch and validate all markets
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      chart_period: ${{ steps.fetch.outputs.chart_period }}
      fetched_at: ${{ steps.fetch.outputs.fetched_at }}
      source_url: ${{ steps.fetch.outputs.source_url }}
      expected_period: ${{ steps.publication_gate.outputs.expected_period }}
      live_period: ${{ steps.publication_gate.outputs.live_period }}
      publication_status: ${{ steps.publication_gate.outputs.publication_status }}
      release_action: ${{ steps.publication_gate.outputs.release_action }}
      manifest_warning: ${{ steps.publication_gate.outputs.manifest_warning }}
      configured_count: ${{ steps.fetch.outputs.configured_count }}
      successful_count: ${{ steps.fetch.outputs.successful_count }}
      failed_count: ${{ steps.fetch.outputs.failed_count }}
      unavailable_count: ${{ steps.fetch.outputs.unavailable_count }}
      configured_names: ${{ steps.fetch.outputs.configured_names }}
      successful_names: ${{ steps.fetch.outputs.successful_names }}
      failed_names: ${{ steps.fetch.outputs.failed_names }}
      unavailable_names: ${{ steps.fetch.outputs.unavailable_names }}
      worldwide_row_count: ${{ steps.fetch.outputs.worldwide_row_count }}
      warning_count: ${{ steps.fetch.outputs.warning_count }}
      warning_messages: ${{ steps.fetch.outputs.warning_messages }}
      critical_failure_count: ${{ steps.fetch.outputs.critical_failure_count }}
      critical_failures: ${{ steps.fetch.outputs.critical_failures }}
      validation_status: ${{ steps.fetch.outputs.validation_status }}
      validated_artifact_name: ${{ steps.artifact_name.outputs.validated_input }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Fetch source charts and run critical validation
        id: fetch
        run: Rscript scripts/fetch_validate.R staging/input

      - name: Check chart freshness and live deployment period
        id: publication_gate
        run: >-
          python3 scripts/publication_gate.py
          --chart-period "${{ steps.fetch.outputs.chart_period }}"
          --source-url "${{ steps.fetch.outputs.source_url }}"
          --event-name "${{ github.event_name }}"
          --schedule "${{ github.event.schedule }}"

      - name: Upload validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging/input/validation-report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload publication decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: publication-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging/input/publication-decision.json
          if-no-files-found: warn
          retention-days: 1

      - name: Name validated input artifact
        id: artifact_name
        if: ${{ success() && steps.publication_gate.outputs.release_action == 'deploy' }}
        run: echo "validated_input=validated-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload validated short-lived snapshot
        if: ${{ success() && steps.publication_gate.outputs.release_action == 'deploy' }}
        id: upload_validated
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.validated_input }}
          path: |
            staging/input/chart-run.rds
            staging/input/validation-report.json
          if-no-files-found: error
          retention-days: 1

  render_primary:
    name: Render staging site (primary)
    needs: fetch_validate
    if: ${{ success() && needs.fetch_validate.outputs.release_action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      candidate_ready: ${{ steps.candidate.outputs.ready }}
      artifact_name: ${{ steps.artifact_name.outputs.site_candidate }}
      site_bytes: ${{ steps.prepare_site.outputs.site_bytes }}
      index_bytes: ${{ steps.prepare_site.outputs.index_bytes }}
      file_count: ${{ steps.prepare_site.outputs.file_count }}
      render_warning_count: ${{ steps.prepare_site.outputs.render_warning_count }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Remove any pre-installed Quarto to avoid apt downgrade conflicts
        run: sudo apt-get purge -y quarto || true

      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.9.38"

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.fetch_validate.outputs.validated_artifact_name }}
          path: staging/input

      - name: Read previous deployment size when available
        run: python3 scripts/read_previous_site_size.py

      - name: Render primary staging output with diagnostics
        id: render_site
        env:
          MUSICCHARTS_VALIDATED_RUN: ${{ github.workspace }}/staging/input/chart-run.rds
        run: bash scripts/render_attempt.sh primary staging/site

      - name: Validate output size and write public manifest
        id: prepare_site
        env:
          MUSICCHARTS_VALIDATED_RUN: ${{ github.workspace }}/staging/input/chart-run.rds
        run: >-
          Rscript scripts/prepare_site.R
          staging/site
          staging/input/chart-run.rds
          staging/input/validation-report.json

      - name: Name primary site candidate
        id: artifact_name
        run: echo "site_candidate=site-candidate-primary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload primary site candidate
        id: upload_candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.site_candidate }}
          path: staging/site
          if-no-files-found: error
          retention-days: 1

      - name: Mark primary candidate ready
        id: candidate
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  render_fallback:
    name: Render staging site (fresh-runner fallback)
    needs: [fetch_validate, render_primary]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.fetch_validate.result == 'success' &&
        needs.fetch_validate.outputs.release_action == 'deploy' &&
        needs.render_primary.outputs.candidate_ready != 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate_ready: ${{ steps.candidate.outputs.ready }}
      artifact_name: ${{ steps.artifact_name.outputs.site_candidate }}
      site_bytes: ${{ steps.prepare_site.outputs.site_bytes }}
      index_bytes: ${{ steps.prepare_site.outputs.index_bytes }}
      file_count: ${{ steps.prepare_site.outputs.file_count }}
      render_warning_count: ${{ steps.prepare_site.outputs.render_warning_count }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Remove any pre-installed Quarto to avoid apt downgrade conflicts
        run: sudo apt-get purge -y quarto || true

      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.9.38"

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.fetch_validate.outputs.validated_artifact_name }}
          path: staging/input

      - name: Read previous deployment size when available
        run: python3 scripts/read_previous_site_size.py

      - name: Render fallback staging output with diagnostics
        id: render_site
        env:
          MUSICCHARTS_VALIDATED_RUN: ${{ github.workspace }}/staging/input/chart-run.rds
        run: bash scripts/render_attempt.sh fallback staging/site

      - name: Validate output size and write public manifest
        id: prepare_site
        env:
          MUSICCHARTS_VALIDATED_RUN: ${{ github.workspace }}/staging/input/chart-run.rds
        run: >-
          Rscript scripts/prepare_site.R
          staging/site
          staging/input/chart-run.rds
          staging/input/validation-report.json

      - name: Name fallback site candidate
        id: artifact_name
        run: echo "site_candidate=site-candidate-fallback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload fallback site candidate
        id: upload_candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.site_candidate }}
          path: staging/site
          if-no-files-found: error
          retention-days: 1

      - name: Mark fallback candidate ready
        id: candidate
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  render_candidate:
    name: Select successful render candidate
    needs: [fetch_validate, render_primary, render_fallback]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.fetch_validate.result == 'success' &&
        needs.fetch_validate.outputs.release_action == 'deploy'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      renderer: ${{ steps.select.outputs.renderer }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      site_bytes: ${{ steps.select.outputs.site_bytes }}
      index_bytes: ${{ steps.select.outputs.index_bytes }}
      file_count: ${{ steps.select.outputs.file_count }}
      render_warning_count: ${{ steps.select.outputs.render_warning_count }}
    steps:
      - uses: actions/checkout@v6
      - name: Require exactly one successful site candidate
        id: select
        run: >-
          python3 scripts/select_render_candidate.py
          --primary-ready "${{ needs.render_primary.outputs.candidate_ready }}"
          --primary-artifact "${{ needs.render_primary.outputs.artifact_name }}"
          --primary-site-bytes "${{ needs.render_primary.outputs.site_bytes }}"
          --primary-index-bytes "${{ needs.render_primary.outputs.index_bytes }}"
          --primary-file-count "${{ needs.render_primary.outputs.file_count }}"
          --primary-render-warning-count "${{ needs.render_primary.outputs.render_warning_count }}"
          --fallback-ready "${{ needs.render_fallback.outputs.candidate_ready }}"
          --fallback-artifact "${{ needs.render_fallback.outputs.artifact_name }}"
          --fallback-site-bytes "${{ needs.render_fallback.outputs.site_bytes }}"
          --fallback-index-bytes "${{ needs.render_fallback.outputs.index_bytes }}"
          --fallback-file-count "${{ needs.render_fallback.outputs.file_count }}"
          --fallback-render-warning-count "${{ needs.render_fallback.outputs.render_warning_count }}"

  test:
    name: Test generated site
    needs: [fetch_validate, render_candidate]
    if: >-
      ${{
        !cancelled() &&
        needs.fetch_validate.outputs.release_action == 'deploy' &&
        needs.render_candidate.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.fetch_validate.outputs.validated_artifact_name }}
          path: staging/input

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.render_candidate.outputs.artifact_name }}
          path: staging/site

      - name: Run parser and generated-site tests
        env:
          MUSICCHARTS_VALIDATED_RUN: ${{ github.workspace }}/staging/input/chart-run.rds
          MUSICCHARTS_SITE_DIR: ${{ github.workspace }}/staging/site
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          Rscript tests/test_fetch_charts.R
          Rscript tests/test_generated_site.R

      - name: Run local HTTP smoke test
        run: |
          python3 -m http.server 8765 --directory staging/site >/tmp/musiccharts-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ >/tmp/musiccharts-index.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/musiccharts-index.html
          curl --fail --silent --show-error http://127.0.0.1:8765/deployment-manifest.json >/tmp/musiccharts-manifest.json
          python3 -c 'import json; data=json.load(open("/tmp/musiccharts-manifest.json")); assert data["validation"]["status"] == "pass"'

  deploy:
    name: Deploy GitHub Pages
    needs: [fetch_validate, render_candidate, test]
    if: >-
      ${{
        !cancelled() &&
        needs.fetch_validate.outputs.release_action == 'deploy' &&
        needs.render_candidate.result == 'success' &&
        needs.test.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.render_candidate.outputs.artifact_name }}
          path: staging/site

      - name: Finalize public deployment metadata
        run: python3 scripts/finalize_deployment.py staging/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: staging/site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Publish run summary
    if: ${{ !cancelled() }}
    needs: [prepare, fetch_validate, render_primary, render_fallback, render_candidate, test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Write publication summary
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          FETCH_RESULT: ${{ needs.fetch_validate.result }}
          PRIMARY_RENDER_RESULT: ${{ needs.render_primary.result }}
          PRIMARY_CANDIDATE_READY: ${{ needs.render_primary.outputs.candidate_ready }}
          FALLBACK_RENDER_RESULT: ${{ needs.render_fallback.result }}
          FALLBACK_CANDIDATE_READY: ${{ needs.render_fallback.outputs.candidate_ready }}
          RENDER_CANDIDATE_RESULT: ${{ needs.render_candidate.result }}
          CANDIDATE_RENDERER: ${{ needs.render_candidate.outputs.renderer }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CHART_PERIOD: ${{ needs.fetch_validate.outputs.chart_period }}
          FETCHED_AT: ${{ needs.fetch_validate.outputs.fetched_at }}
          SOURCE_URL: ${{ needs.fetch_validate.outputs.source_url }}
          EXPECTED_PERIOD: ${{ needs.fetch_validate.outputs.expected_period }}
          LIVE_PERIOD: ${{ needs.fetch_validate.outputs.live_period }}
          PUBLICATION_STATUS: ${{ needs.fetch_validate.outputs.publication_status }}
          RELEASE_ACTION: ${{ needs.fetch_validate.outputs.release_action }}
          MANIFEST_WARNING: ${{ needs.fetch_validate.outputs.manifest_warning }}
          CONFIGURED_COUNT: ${{ needs.fetch_validate.outputs.configured_count }}
          SUCCESSFUL_COUNT: ${{ needs.fetch_validate.outputs.successful_count }}
          FAILED_COUNT: ${{ needs.fetch_validate.outputs.failed_count }}
          UNAVAILABLE_COUNT: ${{ needs.fetch_validate.outputs.unavailable_count }}
          CONFIGURED_NAMES: ${{ needs.fetch_validate.outputs.configured_names }}
          SUCCESSFUL_NAMES: ${{ needs.fetch_validate.outputs.successful_names }}
          FAILED_NAMES: ${{ needs.fetch_validate.outputs.failed_names }}
          UNAVAILABLE_NAMES: ${{ needs.fetch_validate.outputs.unavailable_names }}
          WORLDWIDE_ROW_COUNT: ${{ needs.fetch_validate.outputs.worldwide_row_count }}
          WARNING_COUNT: ${{ needs.fetch_validate.outputs.warning_count }}
          WARNING_MESSAGES: ${{ needs.fetch_validate.outputs.warning_messages }}
          CRITICAL_FAILURE_COUNT: ${{ needs.fetch_validate.outputs.critical_failure_count }}
          CRITICAL_FAILURES: ${{ needs.fetch_validate.outputs.critical_failures }}
          VALIDATION_STATUS: ${{ needs.fetch_validate.outputs.validation_status }}
          SITE_BYTES: ${{ needs.render_candidate.outputs.site_bytes }}
          INDEX_BYTES: ${{ needs.render_candidate.outputs.index_bytes }}
          FILE_COUNT: ${{ needs.render_candidate.outputs.file_count }}
          RENDER_WARNING_COUNT: ${{ needs.render_candidate.outputs.render_warning_count }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/write_final_summary.py
